<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ElectroLab — Simulateur de circuits électroniques · Bac Pro CIEL</title>
<meta name="author" content="Yahn LE PRETTRE - Formaxion Landes">
<style>
:root{--bg:#eef1f5;--panel:#fff;--ink:#1e293b;--muted:#64748b;--line:#d5dbe4;--brand:#0f766e;--brand2:#d5f3ef;--ok:#15803d;--warn:#b45309;--err:#b91c1c;--top:#0b1f2e;--mono:ui-monospace,SFMono-Regular,Menlo,Consolas,"Liberation Mono",monospace}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{font:13px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;color:var(--ink);background:var(--bg);display:flex;flex-direction:column;overflow:hidden}
button,input,select,textarea{font:inherit;color:inherit}
button{background:#fff;border:1px solid var(--line);border-radius:6px;padding:4px 10px;cursor:pointer}
button:hover{background:#f1f5f9}button:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid var(--brand);outline-offset:1px}
button.primary{background:var(--brand);border-color:var(--brand);color:#fff}button.primary:hover{background:#0d5f58}
button.small{padding:1px 6px;font-size:12px}button:disabled{opacity:.5;cursor:default}
input[type=text],input[type=number],input[type=search],select,textarea{border:1px solid var(--line);border-radius:5px;padding:4px 6px;background:#fff;min-width:0}
.mono{font-family:var(--mono)}.muted{color:var(--muted)}.small{font-size:12px}
#top{background:var(--top);color:#e2e8f0;display:flex;align-items:center;gap:14px;padding:6px 12px;flex-wrap:wrap}
#top button{background:#16324a;border-color:#27475f;color:#e2e8f0}#top button:hover{background:#27475f}#top button.accent{background:#0f766e;border-color:#0f766e}
.brand{font-weight:700;font-size:15px}.brand small{font-weight:400;color:#94a3b8;margin-left:6px}.logo{color:#5eead4}.credit{display:block;font-size:10px;font-weight:400;color:#7f93a6;line-height:1}
.grp{display:flex;align-items:center;gap:6px}.grp label{display:flex;align-items:center;gap:4px;font-size:12px;color:#cbd5e1}
.spd input{width:110px}#speedv{min-width:40px;font-family:var(--mono)}#simtime{color:#5eead4;min-width:110px}
.warnbadge{background:#b91c1c;color:#fff;border-radius:10px;padding:1px 8px;font-size:11px}
#main{flex:1;display:flex;min-height:0}
#left{width:230px;background:var(--panel);border-right:1px solid var(--line);display:flex;flex-direction:column;min-height:0}
#tools{display:flex;flex-wrap:wrap;gap:4px;padding:8px;border-bottom:1px solid var(--line)}
#tools button{flex:1 1 auto;font-size:12px;padding:3px 6px}.tool.on{background:var(--brand2);border-color:var(--brand);color:var(--brand);font-weight:600}
#palette{flex:1;overflow:auto;padding:6px 8px}
details summary{cursor:pointer;font-weight:600;padding:4px 2px;color:#334155}
.pal-item{display:flex;align-items:center;gap:8px;width:100%;text-align:left;border:1px solid transparent;background:none;padding:2px 6px;border-radius:6px}
.pal-item:hover{background:#f1f5f9;border-color:var(--line)}.pal-item.armed{background:var(--brand2);border-color:var(--brand)}
.pal-item .pl{flex:1;font-size:12px}.pal-item svg{flex:none}
#center{flex:1;display:flex;flex-direction:column;min-width:0}
#stage{flex:1;position:relative;min-height:160px;overflow:hidden}
#canvas{position:absolute;inset:0;width:100%;height:100%;background:#f7f9fc;user-select:none;touch-action:none}
#canvas[data-tool=wire]{cursor:crosshair}#canvas[data-tool=delete]{cursor:not-allowed}#canvas.panning{cursor:grabbing}
.hint{position:absolute;left:8px;bottom:6px;background:rgba(15,23,42,.8);color:#e2e8f0;padding:3px 8px;border-radius:5px;font-size:12px;pointer-events:none}
#banner{position:absolute;left:50%;top:8px;transform:translateX(-50%);background:#fff7ed;border:1px solid #fdba74;color:#9a3412;padding:5px 12px;border-radius:6px;font-size:12px;box-shadow:0 2px 8px rgba(0,0,0,.12)}
.tip{position:absolute;background:#0f172a;color:#e2e8f0;padding:3px 7px;border-radius:4px;font:12px var(--mono);pointer-events:none;z-index:5}
/* symboles */
.part line,.part path,.part polyline,.part rect,.part circle,.part polygon{stroke:#1e293b;stroke-width:2;fill:none;stroke-linecap:round;stroke-linejoin:round}
.part .bodyhit{stroke:none;fill:transparent;pointer-events:all}.part .hl{stroke:none}.part .thick{stroke-width:3.5}.part .sym-fill{fill:#1e293b}.part .sym-b,.part .sym-b2,.part .sym-c{fill:#fff}
.part .sym-f{fill:none}.part .sym-dash{stroke-dasharray:3 3;stroke-width:1.2}
.part .inst{fill:#e2e8f0;stroke:#475569}.part .inst.mm{fill:#f1c40f;stroke:#7a5c00}.part .lcd{fill:#cfe5b8;stroke:#4d6b36;stroke-width:1.5}.part .dial{fill:#fff;stroke:#444}
.part text{stroke:none;fill:#1e293b;font:10px system-ui,sans-serif;pointer-events:none}.part text.sym-s{font-size:10px;font-weight:600}.part text.sym-xs{font-size:8px;fill:#475569}.part text.sym-r{fill:#b91c1c;font-weight:700}
.part text.mm-read{font:700 14px var(--mono);fill:#1d2b12}.part .led-glow,.part .lamp-glow{stroke:none;pointer-events:none}
.part.sel .hl{stroke:#0ea5e9;stroke-width:2;fill:rgba(14,165,233,.08);stroke-dasharray:4 3}.part .hl{display:none;stroke:none;fill:none}.part.sel .hl{display:block}
.part .pin{fill:#fff;stroke:#64748b;stroke-width:1.5}.part .pin:hover{fill:#fde047;stroke:#a16207}
.part .pin.r{stroke:#dc2626}.part .pin.k{stroke:#111}.part .pin.y{stroke:#ca8a04}.part .pin.c{stroke:#0891b2}
.part .lab{font:11px system-ui,sans-serif;fill:#0f172a;font-weight:600}.part .val{font:10px var(--mono);fill:#475569}
.part.burnt line,.part.burnt path,.part.burnt rect,.part.burnt polygon,.part.burnt circle:not(.pin){stroke:#7f1d1d}.part.burnt .sym-b,.part.burnt .sym-b2{fill:#d6d3d1}
.smoke{pointer-events:none}.smoke text{fill:#b91c1c!important;font:700 11px system-ui!important}
.wire{fill:none;stroke:#0369a1;stroke-width:2.4;stroke-linecap:round;stroke-linejoin:round}.wire.r{stroke:#dc2626}.wire.k{stroke:#111827}.wire.y{stroke:#ca8a04}.wire.c{stroke:#0891b2}
.wire.sel{stroke:#f59e0b;stroke-width:3.4}.wirehit{fill:none;stroke:transparent;stroke-width:12;cursor:pointer}
.junc{fill:#0369a1;stroke:none}#rubber,.rubber{pointer-events:none}.rubber{fill:none;stroke:#f59e0b;stroke-width:2;stroke-dasharray:5 3}
.hover-net{stroke:#f59e0b!important}
/* dock + panneaux */
#dock{height:150px;background:var(--panel);border-top:1px solid var(--line);display:flex;flex-direction:column}
#docktabs{display:flex;gap:2px;padding:3px 6px;border-bottom:1px solid var(--line);background:#f8fafc}.dtab{border:0;background:none;padding:3px 10px;border-radius:5px 5px 0 0}.dtab.on{background:#fff;border:1px solid var(--line);border-bottom-color:#fff;font-weight:600;color:var(--brand)}
#dockmin{margin-left:auto;border:0;background:none}
#dockbody{flex:1;position:relative;overflow:auto}.pane{padding:4px 8px;font-size:12px}
.logline{padding:1px 0;border-bottom:1px dotted #e5e9f0}.logline.warn{color:var(--warn)}.logline.burn{color:var(--err);font-weight:600}.logline.info{color:var(--muted)}
#right{width:330px;background:var(--panel);border-left:1px solid var(--line);display:flex;flex-direction:column;min-height:0}
#rtabs{display:flex;border-bottom:1px solid var(--line)}.rtab{flex:1;border:0;border-radius:0;background:#f8fafc;padding:6px}.rtab.on{background:#fff;font-weight:600;color:var(--brand);box-shadow:inset 0 -2px var(--brand)}
.rpane{flex:1;overflow:auto;padding:10px}
.rpane h3{margin:0 0 6px;font-size:14px}.rpane h4{margin:12px 0 4px;font-size:12px;text-transform:uppercase;letter-spacing:.04em;color:var(--muted)}
.field{display:grid;grid-template-columns:110px 1fr;gap:4px 8px;align-items:center;margin:4px 0}.field label{font-size:12px;color:#475569}
.field input[type=text],.field input[type=number],.field select{width:100%}.field .unit{color:var(--muted);font-size:11px}
.badge{display:inline-block;border-radius:10px;padding:0 7px;font-size:11px}.badge.ok{background:#dcfce7;color:var(--ok)}.badge.ko{background:#fee2e2;color:var(--err)}.badge.warn{background:#ffedd5;color:var(--warn)}
.kv{display:grid;grid-template-columns:auto 1fr;gap:2px 10px;font-family:var(--mono);font-size:12px}.kv span:nth-child(odd){color:var(--muted)}
.tp-card{border:1px solid var(--line);border-radius:8px;padding:8px;margin:8px 0;background:#fcfdff}
.tp-card ol,.tp-card ul{margin:4px 0 4px 18px;padding:0}.tp-card li{margin:3px 0}
.chk{display:flex;gap:6px;align-items:flex-start;margin:3px 0}.chk .m{width:18px;flex:none;text-align:center;font-weight:700}.chk.ok .m{color:var(--ok)}.chk.ko .m{color:var(--err)}
.q{margin:8px 0;padding:6px 8px;border-left:3px solid var(--brand2);background:#f7fbfb}.q.ok{border-color:var(--ok)}.q.ko{border-color:var(--err)}.q input[type=text]{width:90px}
code{background:#eef2f7;border-radius:3px;padding:0 3px;font-family:var(--mono);font-size:12px}
/* fenêtres flottantes (instruments) */
#winlayer{position:fixed;inset:0;pointer-events:none;z-index:20}
.win{position:absolute;pointer-events:auto;background:#d9dee5;border:1px solid #6b7684;border-radius:8px;box-shadow:0 8px 28px rgba(0,0,0,.35);min-width:240px}
.win .wh{background:#31404f;color:#fff;padding:4px 8px;border-radius:7px 7px 0 0;display:flex;align-items:center;gap:8px;cursor:move;font-weight:600}.win .wh .x{margin-left:auto;background:none;border:0;color:#fff;font-size:16px;padding:0 4px;cursor:pointer}
.win .wb{padding:8px}
.mmwin{background:#f1c40f;border-color:#7a5c00;width:300px}.mmwin .wh{background:#5b4600}
.lcdbig{background:#cdddb3;border:2px inset #8a9a70;border-radius:4px;padding:6px 10px;text-align:right;font:700 34px/1.1 var(--mono);color:#1d2b12;letter-spacing:2px;min-height:62px;position:relative}
.lcdbig small{position:absolute;left:6px;top:3px;font-size:11px;font-weight:600;letter-spacing:0}.lcdbig .u{font-size:20px;margin-left:6px}
.dialgrid{display:grid;grid-template-columns:repeat(4,1fr);gap:4px;margin-top:8px}.dialgrid button{padding:5px 2px;font-size:12px;background:#fff6c9;border-color:#a07f00}.dialgrid button.on{background:#1d2b12;color:#e8f5c8;font-weight:700}
.jack{display:flex;justify-content:space-between;margin-top:8px;font-size:11px}.jack i{display:inline-block;width:12px;height:12px;border-radius:50%;margin-right:4px;vertical-align:-2px;border:2px solid #333}
.scwin{width:700px;background:#2b333b;color:#e2e8f0}.scwin .wh{background:#1b2127}.scwin canvas{background:#0b1410;border:2px solid #111;border-radius:4px;display:block;width:100%}
.scctl{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin-top:8px;font-size:12px}.scctl fieldset{border:1px solid #4b5864;border-radius:6px;padding:4px 6px;margin:0}.scctl legend{font-size:11px;padding:0 4px}
.scctl select,.scctl input{width:100%;background:#1b2127;color:#e2e8f0;border-color:#4b5864}.scctl .ch1{color:#facc15}.scctl .ch2{color:#22d3ee}
.scmeas{display:grid;grid-template-columns:repeat(4,1fr);gap:2px 8px;font:12px var(--mono);margin-top:6px}
.psuwin{width:300px}.knobrow{display:grid;grid-template-columns:70px 1fr 70px;gap:6px;align-items:center;margin:6px 0}
.led{display:inline-block;width:12px;height:12px;border-radius:50%;background:#555;vertical-align:-2px;margin-right:4px}.led.g{background:#22c55e;box-shadow:0 0 6px #22c55e}.led.r{background:#ef4444;box-shadow:0 0 6px #ef4444}
.disp7{background:#10170d;color:#7CFC00;font:700 22px var(--mono);padding:2px 8px;border-radius:3px;text-align:right}
.modal{position:fixed;inset:0;background:rgba(15,23,42,.5);display:flex;align-items:center;justify-content:center;z-index:50}.modal>div{background:#fff;border-radius:10px;max-width:760px;max-height:86vh;overflow:auto;padding:16px 20px;box-shadow:0 20px 50px rgba(0,0,0,.4)}
.menu{position:absolute;background:#fff;border:1px solid var(--line);border-radius:8px;box-shadow:0 8px 24px rgba(0,0,0,.2);z-index:40;min-width:340px;max-height:70vh;overflow:auto;padding:4px}
.menu h5{margin:6px 8px 2px;font-size:11px;text-transform:uppercase;color:var(--muted)}.menu button{display:block;width:100%;text-align:left;border:0;border-radius:4px;padding:4px 8px}.menu button small{color:var(--muted);display:block}
.diff{font-size:11px;color:#b45309}
table.cov{border-collapse:collapse;width:100%;font-size:12px}table.cov td,table.cov th{border:1px solid var(--line);padding:3px 6px;text-align:left}.st-ok{color:var(--ok)}.st-part{color:var(--warn)}.st-no{color:var(--muted)}

#canvas.thermo{background:#14101f}#canvas.thermo #gridrect{opacity:.15}#canvas.thermo .part .body{filter:invert(1) grayscale(1)}#canvas.thermo .part text.lab,#canvas.thermo .part text.val{fill:#cbd5e1}#canvas.thermo .wire{stroke:#64748b}
.heatblob{filter:blur(7px);opacity:.95;pointer-events:none}.heattxt{font:600 11px var(--mono);pointer-events:none;stroke:none}
#heatlegend{position:absolute;right:12px;top:10px;background:rgba(15,23,42,.85);color:#e2e8f0;padding:6px 10px;border-radius:6px;font:11px var(--mono);pointer-events:none;z-index:4}
#heatlegend .bar{height:10px;width:170px;border-radius:3px;margin:3px 0;background:linear-gradient(90deg,rgb(32,18,90),rgb(110,30,170) 12%,rgb(200,40,90) 24%,rgb(245,110,30) 40%,rgb(255,200,40) 64%,rgb(255,250,200))}
#heatlegend .sc{display:flex;justify-content:space-between}#btn-heat.on{background:#7c3aed;color:#fff}

.wire.probe{stroke-dasharray:7 3}.probetip{stroke:#fff;stroke-width:1.5;fill:#dc2626;pointer-events:none}.probetip.k{fill:#111827}
.wire.netlit{stroke:#f59e0b!important;stroke-width:3.6}.pinjunc{fill:#0369a1}
#canvas[data-tool=probe]{cursor:crosshair}
.pinmodal{position:fixed;inset:0;background:rgba(15,23,42,.55);display:flex;align-items:center;justify-content:center;z-index:1000}
.pinbox{background:#fff;color:#0f172a;border-radius:10px;padding:16px 18px;width:min(460px,92vw);max-height:86vh;overflow:auto;box-shadow:0 10px 40px rgba(0,0,0,.4)}
.pinbox h3{margin:0 0 8px}.pinin{font-size:20px;letter-spacing:6px;width:9.5em;text-align:center;margin:4px 6px 4px 0}
.pinrow{display:flex;gap:6px;flex-wrap:wrap}.pinbtns{display:flex;gap:6px;flex-wrap:wrap;margin:8px 0}
.pinmsg{min-height:1.2em;font-size:13px}.pinmsg.err{color:#b91c1c;font-weight:600}
.pinlog{max-height:200px;overflow:auto;border:1px solid #cbd5e1;border-radius:6px;padding:6px;font-size:12px;margin:6px 0;background:#f8fafc}
.pinlog .logl.echec,.pinlog .logl.bloque{color:#b91c1c}.pinlog .logl.succes{color:#15803d}
.seghandle{fill:#f59e0b;stroke:#fff;stroke-width:1;pointer-events:none}.wirehit{cursor:move}
details.cours{background:#eff6ff;border:1px solid #bfdbfe;border-left:4px solid #3b82f6;border-radius:8px;padding:6px 10px;margin:8px 0}
details.cours summary{color:#1e40af}.coursbody{font-size:13.5px;line-height:1.45;padding:2px 2px 6px}.coursbody p{margin:6px 0}.coursbody ol{margin:6px 0;padding-left:20px}

</style>
</head>
<body>
<header id="top">
  <div class="brand"><span class="logo" aria-hidden="true">⏚</span> ElectroLab <small>Simulateur de circuits · Bac Pro CIEL</small><span class="credit">Créé par Yahn LE PRETTRE - Formaxion Landes</span></div>
  <div class="grp" role="group" aria-label="Fichier">
    <button id="btn-new" title="Nouveau schéma vide">Nouveau</button>
    <button id="btn-open" title="Ouvrir un fichier .json">Ouvrir</button>
    <button id="btn-save" title="Enregistrer le schéma (.json)">Enregistrer</button>
    <button id="btn-scen" class="accent" title="Charger un TP">TP ▾</button>
  </div>
  <div class="grp sim" role="group" aria-label="Simulation">
    <button id="btn-run" title="Pause / lecture (Espace)">⏸ Pause</button>
    <button id="btn-reset" title="Remet le temps à zéro et décharge les condensateurs">↺ Reset</button>
    <label class="spd" title="Vitesse : temps simulé par seconde réelle">Vitesse <input id="speed" type="range" min="0" max="100" value="60" aria-label="Vitesse"><output id="speedv">×1</output></label>
    <span id="simtime" class="mono">t = 0.000 s</span><span id="simwarn" class="warnbadge" style="display:none"></span>
  </div>
  <div class="grp opts" role="group" aria-label="Options">
    <label title="Affiche les tensions/courants dans l'inspecteur (sinon : instruments obligatoires)"><input type="checkbox" id="opt-aide"> Grandeurs affichées</label>
    <label title="Voir les pannes cachées, injecter des pannes, voir les corrigés"><input type="checkbox" id="opt-teacher"> Mode enseignant</label>
    <button id="btn-lock" title="Verrouiller le mode enseignant par un code PIN à 6 chiffres (journal des tentatives)">🔑</button>
    <button id="btn-heat" title="Caméra thermique : affiche la température estimée des composants (comme en vraie maintenance)">🌡 Thermographie</button>
    <button id="btn-fit" title="Recentrer la vue">⌖</button>
    <button id="btn-help" title="Aide et couverture du programme">? Aide</button>
  </div>
</header>
<div id="main">
  <aside id="left" aria-label="Composants">
    <div id="tools" role="toolbar" aria-label="Outils">
      <button class="tool on" data-tool="select" title="Sélection / déplacement (V)">🖱 Sélection</button>
      <button class="tool" data-tool="wire" title="Câbler (C) — ou tirez depuis une broche">〰 Fil</button>
      <button class="tool" data-tool="probe" title="Pointes de touche du multimètre (P) : clic sur une broche = pointe rouge, clic suivant = pointe noire">🔴 Pointes</button>
      <button class="tool" data-tool="delete" title="Supprimer (Suppr)">🗑 Supprimer</button>
      <button id="btn-rot" title="Pivoter le composant sélectionné (R)">⟳ Pivoter</button>
      <button id="btn-undo" title="Annuler (Ctrl+Z)">↶</button>
    </div>
    <div id="palette"></div>
  </aside>
  <section id="center">
    <div id="stage">
      <div id="heatlegend" style="display:none">Thermographie (°C)<div class="bar"></div><div class="sc"><span>25</span><span>55</span><span>75</span><span>105</span><span>150+</span></div></div>
      <svg id="canvas" xmlns="http://www.w3.org/2000/svg" role="application" aria-label="Schéma électronique">
        <defs><pattern id="gridp" width="20" height="20" patternUnits="userSpaceOnUse"><circle cx="0" cy="0" r="1" fill="#b9c3d1"/></pattern></defs>
        <g id="world"><rect id="gridrect" x="-4000" y="-4000" width="8000" height="8000" fill="url(#gridp)"/><g id="wires"></g><g id="parts"></g><g id="juncs"></g><g id="rubber"></g></g>
      </svg>
      <div id="toolhint" class="hint"></div>
      <div id="banner" style="display:none"></div>
      <div id="tooltip" class="tip" style="display:none"></div>
    </div>
    <div id="dock">
      <div id="docktabs" role="tablist"><button class="dtab on" data-dock="log">Journal</button><button class="dtab" data-dock="note">Carnet de mesures</button><button id="dockmin" title="Réduire / afficher">▾</button></div>
      <div id="dockbody"><div id="pane-log" class="pane"></div><div id="pane-note" class="pane" style="display:none"></div></div>
    </div>
  </section>
  <aside id="right" aria-label="Propriétés">
    <div id="rtabs" role="tablist"><button class="rtab on" data-r="insp">Propriétés</button><button class="rtab" data-r="tp">Sujet de TP</button></div>
    <div id="inspector" class="rpane"></div>
    <div id="tppane" class="rpane" style="display:none"></div>
  </aside>
</div>
<div id="winlayer"></div>
<input type="file" id="filein" accept=".json,application/json" style="display:none">
<script>
/* util.js — espace de noms, helpers DOM, formats d'ingénieur, PRNG */
(function (g) {
'use strict';
const NS = g.NS = g.NS || {};

NS.h = function (tag, attrs, ...kids) {

  const name = m[1] || 'div'; id = m[2]; cls = (m[3] || '').split('.').filter(Boolean);
  const svg = ['svg', 'g', 'path', 'rect', 'circle', 'line', 'text', 'polyline', 'polygon', 'ellipse', 'defs', 'marker', 'title'].includes(name) && (attrs && attrs.__svg || name === 'svg' || NS._inSvg);
  const el = svg ? document.createElementNS(SVGNS, name) : document.createElement(name);

    if (sc.safety) box.appendChild(h('div.tp-card', { style: { background: '#fff7ed', borderColor: '#fdba74' } }, h('b', '⚠ Sécurité'), h('div', { html: sc.safety })));
    box.appendChild(h('div.tp-card', h('b', 'Travail demandé'), h('ol', sc.steps.map(s => h('li', { html: s })))));
    if (this.teacher && sc.variants && sc.faultInfo) box.appendChild(h('div.tp-card', { style: { background: '#fef2f2' } }, h('b', 'Panne injectée (enseignant) : '), sc.faultInfo(tp.variant)));
    if (sc.questions && sc.questions.length) {
      box.appendChild(h('h4', 'Questions'));
      sc.questions.forEach((q, i) => box.appendChild(this.questionEl(q, i)));
      box.appendChild(h('button', { onclick: () => this.checkAnswers() }, 'Valider mes réponses'));
    }
    box.appendChild(h('h4', 'Vérification du montage'));
    const cb = h('div#tpchecks'); box.appendChild(cb); if (tp.results) this.showChecks(cb, tp.results);
    box.appendChild(h('div', { style: { display: 'flex', gap: '6px', flexWrap: 'wrap', margin: '8px 0' } }, h('button.primary', { onclick: () => this.runChecks() }, '✔ Vérifier mon travail'), h('button', { onclick: () => this.restartTP() }, sc.variants ? (sc.variantLabel || '↻ Nouvelle panne') : '↻ Recommencer'), h('button', { onclick: () => this.showCorrection() }, '📖 Correction')));
    if (sc.variants) box.appendChild(h('div.small.muted', 'Démarche de dépannage : 1) observer et décrire le symptôme 2) mesurer pour localiser (tensions, puis composants hors tension) 3) identifier le composant 4) remplacer 5) contrôler le fonctionnement.'));
    this._corr = h('div#tpcorr'); box.appendChild(this._corr);
  }
  questionEl(q, i) {
    const res = this.tp.qres[i]; const cls = res === undefined ? '' : res ? 'ok' : 'ko'; const row = h('div.q.' + cls, h('div', { html: (i + 1) + '. ' + q.q }));
    if (q.type === 'choice') { const name = 'q' + i; q.options.forEach((o, k) => row.appendChild(h('label', { style: { display: 'block' } }, h('input', { type: 'radio', name, checked: this.answers[i] === k, onchange: () => { this.answers[i] = k; } }), ' ' + o))); }
    else if (q.type === 'part') { const sel = h('select', { onchange: e => { this.answers[i] = e.target.value; } }, h('option', { value: '' }, '— choisir —'), this.circuit.parts.filter(p => !['ground', 'multimeter', 'scope', 'psu', 'gbf', 'mains', 'battery'].includes(p.type)).map(p => h('option', { value: p.ref, selected: this.answers[i] === p.ref }, p.ref + ' (' + PARTS[p.type].label + ')'))); row.appendChild(sel); }
    else if (q.type === 'text') row.appendChild(h('textarea', { rows: 2, style: { width: '100%' }, onchange: e => { this.answers[i] = e.target.value; } }, this.answers[i] || ''));
    else row.appendChild(h('div', h('input', { type: 'text', value: this.answers[i] === undefined ? '' : this.answers[i], onchange: e => { this.answers[i] = e.target.value; } }), ' ', h('span.muted', q.unit || '')));
    if (res !== undefined) row.appendChild(h('div.small', res ? '✔ Correct' : '✘ Incorrect' + (q.hint ? ' — ' + q.hint : ''))); return row;
  }
  checkAnswers() {
    const tp = this.tp, sc = tp.sc; const ctx = this.ctx();
    sc.questions.forEach((q, i) => {
      const a = this.answers[i]; let ok = false; if (a === undefined || a === '') { tp.qres[i] = false; return; }
      try {
        if (q.type === 'choice') ok = a === (typeof q.correct === 'function' ? q.correct(ctx) : q.correct); else if (q.type === 'part') ok = [].concat(typeof q.correct === 'function' ? q.correct(ctx) : q.correct).map(String).includes(String(a)); else if (q.type === 'text') ok = true;
        else { const v = NS.parseVal(String(a)); const exp = typeof q.answer === 'function' ? q.answer(ctx) : q.answer; const tol = q.tol === undefined ? 0.05 : q.tol; ok = !isNaN(v) && Math.abs(v - exp) <= Math.max(Math.abs(exp) * tol, q.abs || 0); }
      } catch (e) { ok = false; }
      tp.qres[i] = ok;
    });
    this.renderTP();
  }
  ctx() { const sim = this.sim; if (sim.dirty) sim.rebuild(); const x = NS.makeCtx(sim); x.tp = this.tp; return x; }
  runChecks() {
    const tp = this.tp; if (!tp) return; const res = NS.evalChecks(tp.sc, this.circuit, tp, { keepRt: true });
    tp.results = res; const cb = $('#tpchecks'); if (cb) { clear(cb); this.showChecks(cb, res); }
  }
  showChecks(box, res) {
    res.forEach(r => box.appendChild(h('div.chk.' + (r.ok ? 'ok' : 'ko'), h('span.m', r.ok ? '✔' : '✘'), h('span', { html: r.label }))));
    const n = res.filter(r => r.ok).length; box.appendChild(h('div', { style: { margin: '4px 0' } }, h('span.badge.' + (n === res.length ? 'ok' : 'warn'), n + ' / ' + res.length + ' critères validés')));
  }
  showCorrection() {
    const tp = this.tp; if (!tp) return; const sc = tp.sc; const el = this._corr; clear(el);
    const doIt = () => { clear(el); el.appendChild(h('div.tp-card', h('b', 'Correction'), h('div', { html: typeof sc.correction === 'function' ? sc.correction(tp.variant) : (sc.correction || '') }))); if (sc.solve) el.appendChild(h('button', { onclick: () => { sc.solve(this.circuit, this.ctx(), tp.variant); this.sim.invalidate(); this.editor.render(); this.log('Solution appliquée au schéma', 'info'); } }, 'Appliquer la solution au schéma')); };
    if (this.teacher) return doIt();
    el.appendChild(h('div.tp-card', 'Avez-vous cherché par vous-même ? ', h('button', { onclick: doIt }, 'Afficher la correction')));
  }
}
NS.App = App;
})(typeof window !== 'undefined' ? window : globalThis);

</script>
<script>
/* cours.js — apports théoriques (rappels de cours) affichés au début de chaque TP, sous forme de blocs dépliables */
(function (g) {
  const NS = g.NS = g.NS || {};
  'use strict';
  const C = NS.COURS = {};
  const sub = s => s;
  C.ohm = [
    { t: 'Tension, courant, résistance', h: '<p>La <b>tension</b> U (volt, V) se mesure <b>en parallèle</b> entre deux points. Le <b>courant</b> I (ampère, A) se mesure <b>en série</b> : il faut ouvrir le circuit et y insérer l\'ampèremètre.</p><p><b>Loi d\'Ohm</b> : U = R·I (U en V, R en Ω, I en A). Une résistance de 1 kΩ sous 5 V est traversée par 5 mA.</p><p>Un voltmètre a une résistance interne très grande (≈ 10 MΩ), un ampèremètre très faible : <b>ne jamais brancher un ampèremètre en parallèle sur une source</b> (court-circuit, fusible grillé).</p>' },
    { t: 'L\'alimentation de laboratoire', h: '<p>Elle fournit une tension réglable et une <b>limitation de courant</b> : si la charge réclame plus que la limite, la tension s\'effondre (mode CC, courant constant) pour protéger le montage. Régler d\'abord la tension à vide, puis la limite.</p>' }
  ];
  C.assoc = [{ t: 'Associations de résistances', h: '<p><b>Série</b> : même courant, les tensions s\'ajoutent. R<sub>éq</sub> = R<sub>1</sub> + R<sub>2</sub> + …</p><p><b>Parallèle</b> : même tension, les courants s\'ajoutent. 1/R<sub>éq</sub> = 1/R<sub>1</sub> + 1/R<sub>2</sub> + … ; pour deux résistances R<sub>éq</sub> = R<sub>1</sub>·R<sub>2</sub>/(R<sub>1</sub>+R<sub>2</sub>) (toujours plus petite que la plus petite).</p><p><b>Diviseur de courant</b> : I<sub>1</sub> = I·R<sub>2</sub>/(R<sub>1</sub>+R<sub>2</sub>) — la plus petite résistance prend le plus de courant.</p><p><b>Mesure d\'une résistance</b> : toujours <b>hors tension</b> et composant isolé, sinon l\'ohmmètre mesure tout le réseau.</p>' }];
  C.kirchhoff = [{ t: 'Lois de Kirchhoff', h: '<p><b>Loi des nœuds</b> : la somme des courants qui arrivent à un nœud égale la somme de ceux qui en partent (Σ I<sub>entrants</sub> = Σ I<sub>sortants</sub>).</p><p><b>Loi des mailles</b> : la somme algébrique des tensions le long d\'une maille fermée est nulle. On choisit un sens de parcours ; une tension est comptée + si on traverse le dipôle de − vers +… selon la convention choisie, et on s\'y tient.</p><p>Méthode : orienter les courants, écrire les équations des nœuds et des mailles indépendantes, résoudre, puis <b>vérifier par la mesure</b> (écart attendu &lt; 2–3 %, dû à la tolérance des résistances).</p>' }];
  C.diviseur = [{ t: 'Diviseur de tension', h: '<p>Deux résistances en série sous une tension E : <b>U<sub>s</sub> = E·R<sub>2</sub>/(R<sub>1</sub> + R<sub>2</sub>)</b>, U<sub>s</sub> étant prise aux bornes de R<sub>2</sub>. Valable <b>à vide</b> (aucun courant prélevé).</p><p>Si on branche une charge (ou un voltmètre de résistance interne R<sub>v</sub>), R<sub>2</sub> est remplacée par R<sub>2</sub>//R<sub>v</sub> : la tension mesurée baisse. L\'erreur est faible si R<sub>v</sub> ≫ R<sub>2</sub> (règle : R<sub>v</sub> ≥ 100·R<sub>2</sub>). C\'est l\'<b>erreur de méthode</b> : l\'instrument perturbe ce qu\'il mesure.</p>' }];
  C.puissance = [{ t: 'Puissance et effet Joule', h: '<p>P = U·I = R·I² = U²/R (en watts). Dans une résistance, toute la puissance est transformée en <b>chaleur</b> (effet Joule).</p><p>Une résistance a une <b>puissance maximale</b> (1/4 W, 1/2 W, 1 W…). On dimensionne avec une <b>marge ×2</b> : P<sub>nominale</sub> ≥ 2·P<sub>dissipée</sub>. Au-delà : surchauffe, dérive de valeur puis destruction (visible à la caméra thermique).</p><p>Énergie : W = P·t (joules, ou Wh).</p>' }];
  C.led = [{ t: 'La LED et sa résistance de limitation', h: '<p>Une LED est une diode : elle ne conduit que dans un sens (anode + → cathode −) et à partir d\'une <b>tension de seuil</b> V<sub>F</sub> (≈ 1,8–2 V rouge, ≈ 3 V bleue/blanche). Au-delà, le courant croît très vite : <b>sans résistance, elle est détruite</b>.</p><p>Loi des mailles : E = R·I<sub>F</sub> + V<sub>F</sub> donc <b>R = (E − V<sub>F</sub>)/I<sub>F</sub></b>. Exemple : E = 5 V, V<sub>F</sub> = 2 V, I<sub>F</sub> = 10 mA → R = 300 Ω → on prend la valeur normalisée <b>E12</b> supérieure (330 Ω) pour ne pas dépasser I<sub>F</sub>.</p><p>Série E12 : 10, 12, 15, 18, 22, 27, 33, 39, 47, 56, 68, 82 (× 10<sup>n</sup>).</p>' }];
  C.rc = [{ t: 'Circuit RC : charge et décharge', h: '<p>Le condensateur stocke des charges : Q = C·U, et i = C·du/dt. La tension à ses bornes <b>ne peut pas varier instantanément</b>.</p><p><b>Constante de temps</b> τ = R·C. Charge : u<sub>C</sub>(t) = E·(1 − e<sup>−t/τ</sup>) ; décharge : u<sub>C</sub>(t) = E·e<sup>−t/τ</sup>.</p><p>À t = τ : 63 % de la valeur finale (charge) ou 37 % de la valeur initiale (décharge). Le régime est considéré établi après <b>5 τ</b> (99,3 %).</p><p>Sur l\'oscilloscope : repérer 0,63·E et lire le temps correspondant = τ. Ordre de grandeur : 10 kΩ × 100 nF = 1 ms.</p>' }];
  C.signaux = [{ t: 'Signaux périodiques et oscilloscope', h: '<p><b>Période</b> T (s) et <b>fréquence</b> f = 1/T (Hz). Pour un sinus : <b>V<sub>eff</sub> = V<sub>max</sub>/√2</b> (≈ 0,707·V<sub>max</sub>) ; V<sub>pp</sub> = 2·V<sub>max</sub> (sans composante continue). Valeur moyenne d\'un sinus pur : 0 V.</p><p>Le multimètre en V∿ donne la valeur <b>efficace</b>, en V⎓ la valeur <b>moyenne</b>.</p><p>Oscilloscope : la <b>sensibilité verticale</b> (V/div) et la <b>base de temps</b> (s/div) se règlent pour occuper l\'écran ; le <b>déclenchement</b> (trigger, niveau et front) stabilise l\'image. Mesure = nombre de divisions × calibre. Couplage DC : tout le signal ; AC : la composante continue est retirée. La masse de la sonde est <b>reliée à la masse du circuit</b>.</p>' }];
  C.filtre = [{ t: 'Filtre RC passe-bas', h: '<p>Le condensateur laisse mal passer les basses fréquences et court-circuite les hautes : le montage R en série, C en parallèle sur la sortie est un <b>passe-bas</b>.</p><p>Fréquence de coupure : <b>f<sub>c</sub> = 1/(2π·R·C)</b>. Gain : G = U<sub>s</sub>/U<sub>e</sub>. À f<sub>c</sub>, G = 1/√2 ≈ <b>0,707</b>, soit <b>−3 dB</b>, et la sortie est en retard de 45°.</p><p>Gain en décibels : G<sub>dB</sub> = 20·log(U<sub>s</sub>/U<sub>e</sub>). Au-delà de f<sub>c</sub>, le gain décroît de <b>−20 dB par décade</b>.</p><p>Exemple : R = 1,6 kΩ, C = 100 nF → f<sub>c</sub> ≈ 1 kHz.</p>' }];
  C.transfo = [{ t: 'Le transformateur', h: '<p>Deux enroulements (primaire / secondaire) couplés par un noyau magnétique : il ne fonctionne qu\'en <b>alternatif</b> et <b>isole galvaniquement</b> le secondaire du secteur.</p><p>Rapport de transformation : <b>m = U<sub>2</sub>/U<sub>1</sub> = N<sub>2</sub>/N<sub>1</sub></b>. Un 230 V / 12 V a m ≈ 0,052. Les valeurs sont des tensions <b>efficaces</b> : la tension crête secondaire est 12·√2 ≈ 17 V.</p><p>À vide la tension est un peu plus haute que la valeur nominale ; en charge elle baisse (résistance des enroulements). Puissance apparente S = U·I en <b>VA</b>.</p><p><b>Sécurité</b> : le primaire est au potentiel du secteur (230 V) — on ne mesure jamais à main nue.</p>' }];
  C.redress = [{ t: 'Redressement', h: '<p>Une diode idéale conduit si V<sub>A</sub> &gt; V<sub>K</sub> + V<sub>seuil</sub> (≈ 0,6–0,7 V pour le silicium), sinon elle est bloquée.</p><p><b>Simple alternance</b> : une diode, on garde une alternance sur deux. V<sub>moy</sub> ≈ V<sub>max</sub>/π.</p><p><b>Double alternance</b> (pont de 4 diodes) : deux diodes conduisent à chaque alternance (on perd 2 × V<sub>seuil</sub>) ; V<sub>moy</sub> ≈ 2·V<sub>max</sub>/π ≈ 0,64·V<sub>max</sub>, fréquence d\'ondulation = <b>2 × 50 Hz = 100 Hz</b>.</p><p>La tension reste « pulsée » : on la filtre ensuite avec un condensateur.</p>' }];
  C.filtrage = [{ t: 'Filtrage par condensateur', h: '<p>Le condensateur se charge au sommet de chaque arche puis se décharge dans la charge : la tension devient presque continue avec une <b>ondulation</b> ΔV.</p><p>Pour un redressement double alternance : <b>ΔV ≈ I/(2·f·C)</b> (f = 50 Hz) ; simple alternance : ΔV ≈ I/(f·C). Plus C et plus f sont grands, plus l\'ondulation est faible.</p><p>Dimensionnement : C ≥ I/(2·f·ΔV). Ex. 110 mA, ΔV = 1 V : C ≥ 1,1 mF → on prend 2200 µF. Choisir une <b>tension de service</b> supérieure à V<sub>max</sub> (marge ≥ 30 %), attention à la polarité des chimiques.</p><p>Un condensateur vieilli (séché) a une capacité plus faible et une résistance série élevée : l\'ondulation augmente.</p>' }];
  C.regul = [{ t: 'Régulation linéaire (78xx)', h: '<p>Le régulateur <b>7805</b> fournit 5 V stables tant que U<sub>e</sub> ≥ U<sub>s</sub> + <b>dropout</b> (≈ 2 V) : il faut donc au moins ≈ 7 V en entrée, et pas plus de 35 V.</p><p>Il se comporte comme une résistance variable en série avec la charge : la puissance perdue est <b>P = (U<sub>e</sub> − U<sub>s</sub>)·I</b>, transformée en chaleur (rendement η = U<sub>s</sub>/U<sub>e</sub>). Si P est grande → dissipateur thermique.</p><p>Condensateurs de découplage (≈ 330 nF en entrée, 100 nF en sortie) pour la stabilité. Le régulateur a une limitation de courant (≈ 1 A) et une protection thermique.</p>' }];
  C.test = [{ t: 'Tester un composant hors tension', h: '<p>Toujours <b>hors tension</b> et, si possible, composant déconnecté d\'au moins une borne (sinon on mesure le réseau).</p><p><b>Ohmmètre</b> : le multimètre injecte un petit courant et mesure la tension. Résistance : comparer à la valeur nominale ± tolérance (5 % : bandes or). Coupée → « OL » ; en court-circuit → ≈ 0 Ω.</p><p><b>Test diode</b> : sens passant → affiche V<sub>seuil</sub> (≈ 0,5–0,7 V) ; sens bloquant → « OL ». Les deux sens bas = diode en court-circuit ; les deux « OL » = coupée.</p><p><b>Continuité</b> : bip si R &lt; quelques dizaines d\'Ω (fusible, câble, piste).</p><p>Astuce : l\'outil <b>🔴 Pointes</b> permet de poser les pointes d\'un clic sur les bornes, comme en vrai.</p>' }];
  C.zener = [{ t: 'La diode Zener', h: '<p>Polarisée en <b>inverse</b>, une Zener conduit à partir de sa tension V<sub>Z</sub> (claquage non destructif) et maintient alors ≈ V<sub>Z</sub> à ses bornes, malgré les variations de courant. En direct, elle se comporte comme une diode normale.</p><p>Stabilisation : résistance série R<sub>S</sub> + Zener en parallèle sur la charge. <b>R<sub>S</sub> = (E − V<sub>Z</sub>)/(I<sub>Z</sub> + I<sub>charge</sub>)</b>.</p><p>Il faut I<sub>Z min</sub> pour rester dans la zone de Zener ; la Zener dissipe P<sub>Z</sub> = V<sub>Z</sub>·I<sub>Z</sub> (≤ P<sub>max</sub>, 0,5 W ou 1,3 W). Au pire : charge débranchée, tout le courant passe dans la Zener.</p>' }];
  C.transistor = [{ t: 'Transistor bipolaire en commutation', h: '<p>NPN : le petit courant de <b>base</b> I<sub>B</sub> commande le courant de <b>collecteur</b> I<sub>C</sub> : <b>I<sub>C</sub> = β·I<sub>B</sub></b> (β ≈ 100–300) tant qu\'il est en régime linéaire. V<sub>BE</sub> ≈ 0,7 V quand la base conduit.</p><p><b>Bloqué</b> : I<sub>B</sub> = 0 → I<sub>C</sub> ≈ 0, V<sub>CE</sub> ≈ V<sub>cc</sub> (interrupteur ouvert).<br><b>Saturé</b> : I<sub>B</sub> est assez grand pour que I<sub>C</sub> = (V<sub>cc</sub> − V<sub>CEsat</sub>)/R<sub>C</sub>, V<sub>CE</sub> ≈ 0,1–0,2 V (interrupteur fermé).</p><p>Pour saturer : <b>I<sub>B</sub> ≥ I<sub>C</sub>/β</b>, avec une marge (×2 à ×5). R<sub>B</sub> = (V<sub>commande</sub> − 0,7)/I<sub>B</sub>.</p>' }];
  C.relais = [{ t: 'Relais et charges inductives', h: '<p>Un <b>relais</b> commande un circuit de puissance (contacts COM / NO normalement ouvert / NC normalement fermé) à partir d\'un petit courant dans sa <b>bobine</b>, avec isolation galvanique.</p><p>Une bobine s\'oppose aux variations de courant : <b>u = −L·di/dt</b>. Quand le transistor coupe brutalement le courant, une <b>surtension</b> de plusieurs dizaines de volts apparaît, capable de détruire le transistor (claquage, avalanche).</p><p>Solution : <b>diode de roue libre</b> en inverse aux bornes de la bobine : elle offre au courant un chemin pour s\'éteindre, la tension est limitée à ≈ V<sub>cc</sub> + 0,7 V. Cathode côté +.</p>' }];
  C.inverseur = [{ t: 'L\'AOP en amplificateur inverseur', h: '<p>Un amplificateur opérationnel (AOP) amplifie la différence ε = V<sub>+</sub> − V<sub>−</sub>. Il est alimenté en <b>±12 V</b> (alimentation symétrique) et sa sortie ne peut pas dépasser ≈ les tensions d\'alimentation : c\'est la <b>saturation</b>.</p><p>Avec une <b>contre-réaction</b> (R<sub>f</sub> de la sortie vers l\'entrée −), l\'AOP est en régime linéaire : ε ≈ 0 et V<sub>−</sub> ≈ V<sub>+</sub> = 0 V (masse virtuelle). Le courant d\'entrée est nul.</p><p><b>Gain G = V<sub>s</sub>/V<sub>e</sub> = − R<sub>f</sub>/R<sub>1</sub></b> (signe − : sortie en opposition de phase). Dès que |G·V<sub>e</sub>| dépasse la tension de saturation, la sortie est écrêtée.</p>' }];
  C.cre = [{ t: 'Comparateur et capteur LDR', h: '<p>La <b>LDR</b> (photorésistance) a une résistance qui <b>diminue quand l\'éclairement augmente</b> (quelques centaines d\'Ω en plein jour, plusieurs MΩ dans le noir).</p><p>Placée dans un <b>pont diviseur</b>, elle donne une tension V<sub>mesure</sub> image de la lumière. Un AOP <b>sans contre-réaction</b> (comparateur) compare V<sub>+</sub> et V<sub>−</sub> : si V<sub>+</sub> &gt; V<sub>−</sub> la sortie vaut +V<sub>sat</sub>, sinon −V<sub>sat</sub>. Un potentiomètre règle le <b>seuil</b> de basculement.</p><p>La sortie du comparateur commande ensuite un transistor et un relais ou une LED (lampe qui s\'allume à la tombée de la nuit).</p>' }];
  const METH = { t: 'Méthode de dépannage', h: '<ol><li><b>Constater</b> le symptôme (que fait le système, que devrait-il faire ?) ;</li><li><b>Hypothèses</b> : quels blocs de la chaîne fonctionnelle peuvent l\'expliquer ?</li><li><b>Mesurer sous tension</b> en remontant de la sortie vers l\'entrée : on cherche le premier point où la tension est anormale (dichotomie) ;</li><li><b>Localiser</b> le bloc, puis, <b>hors tension</b>, tester les composants (ohmmètre, diode, continuité) ;</li><li><b>Chercher la cause</b> avant de remplacer (un fusible qui fond est le symptôme d\'un court-circuit) ;</li><li><b>Réparer</b> (composant identique) et <b>contrôler</b> le fonctionnement complet.</li></ol><p><b>Sécurité</b> : couper et décharger les condensateurs avant d\'intervenir ; ne jamais court-circuiter ni mettre de fusible plus fort.</p>' };

<script>
/* scenarios.js — cadre des TP : outils de construction, contexte de vérification, couverture du programme */
(function (g) {
'use strict';
const NS = g.NS = g.NS || {};
const SC = NS.SCENARIOS = [];

/* ---------- construction ---------- */
NS.mk = function (c) {
  const api = {
    c,
    p(type, ref, x, y, params, rot) { const i = c.add(type, x, y, params, ref); i.rot = rot || 0; return i; },
    /* fil entre deux broches ; pts = points de passage exacts */
    w(a, pa, b, pb, pts, color) { return c.link(a, pa, b, pb, pts || [], color); },
    j(x, y) { return c.junction(x, y); },
    wj(ref, pin, j, pts) { const p = c.byRef(ref); return c.wire({ c: p.id, p: c.pinIndex(p, pin) }, { j: j.id }, pts || []); },
    jj(j1, j2, pts) { return c.wire({ j: j1.id }, { j: j2.id }, pts || []); },
  };
  return api;
};
/* remplace un composant par un neuf (même valeur) */
NS.replacePart = function (inst) { inst.fault = null; inst.burnt = null; inst.rt = {}; inst.replaced = (inst.replaced || 0) + 1; };

/* ---------- contexte de vérification (utilisé par l'appli et par les tests) ---------- */
NS.makeCtx = function (sim) {
  const c = sim.c; const ensure = () => { if (sim.dirty) sim.rebuild(); };
  const ctx = {
    sim, c, tp: null,
    v: (r, p) => sim.vPin(r, p), vd: (r1, p1, r2, p2) => sim.vPin(r1, p1) - sim.vPin(r2, p2),
    el: r => sim.el(r), part: r => c.byRef(r), I: r => sim.el(r).I, replaced: r => (c.byRef(r).replaced || 0),
    settle: t => sim.advance(t || 0.5),
    net(r, p) { ensure(); const part = c.byRef(r); return c.pinNode[part.id][c.pinIndex(part, p)]; },
    meters() { ensure(); return c.parts.filter(p => p.type === 'multimeter').map(p => ({ part: p, el: sim.el(p), mode: p.p.mode, a: c.pinNode[p.id][0], b: c.pinNode[p.id][1] })); },
    /* voltmètre câblé entre les broches données ? */
    voltmeterAcross(r1, p1, r2, p2, ac) { const a = ctx.net(r1, p1), b = ctx.net(r2, p2); if (a === b) return false; return ctx.meters().some(m => m.mode === (ac ? 'VAC' : 'VDC') && ((m.a === a && m.b === b) || (m.a === b && m.b === a))); },
    /* ampèremètre en série avec le composant (même courant) ? */
    ammeterIn(ref, minI) { const I = ctx.el(ref).I; return ctx.meters().some(m => (m.mode === 'mA' || m.mode === 'A') && m.a !== m.b && Math.abs(m.el.I || 0) > (minI || 1e-4) && Math.abs(Math.abs(m.el.I) - Math.abs(I)) <= 0.05 * Math.abs(I) + 1e-6); },
    anyBurnt() { return c.parts.filter(p => p.burnt && !(p.type === 'multimeter')); },
    /* échantillonne une grandeur pendant T secondes */
    measure(fn, T, n) { n = n || 400; const out = []; const dt = T / n; for (let i = 0; i < n; i++) { sim.advance(dt); out.push(fn()); } return { min: Math.min(...out), max: Math.max(...out), mean: out.reduce((a, b) => a + b, 0) / out.length, pp: Math.max(...out) - Math.min(...out), data: out }; },
    scopeWired(r, ch1, ch2) { // CH1/CH2/GND câblés sur les nœuds donnés ([ref,pin])
      const so = c.parts.find(p => p.type === 'scope'); if (!so) return false; const n = c.pinNode[so.id]; const want = (pair) => ctx.net(pair[0], pair[1]);
      return (!ch1 || n[0] === want(ch1)) && (!ch2 || n[1] === want(ch2)) && n[2] === 0;
    },
  };
  return ctx;
};
/* exécute les critères d'un TP sur une COPIE du circuit (n'altère pas la simulation en cours) */
NS.evalChecks = function (sc, circuit, tp, opts) {
  const c2 = NS.deserialize(NS.serialize(circuit)); circuit.parts.forEach(p => { const q = c2.part(p.id); if (q) { q.replaced = p.replaced; q.burnt = p.burnt; q.fault = p.fault; q.dev = p.dev; } });
  if (opts && opts.keepRt) circuit.parts.forEach(p => { const q = c2.part(p.id); q.rt = JSON.parse(JSON.stringify(p.rt || {}, (k, v) => (k === 'ring' ? undefined : v))); });
  const sim2 = new NS.Sim(c2); const ctx = NS.makeCtx(sim2); ctx.tp = tp; sim2.advance(sc.settle || 1.0);
  const res = sc.checks.map(k => { let ok = false; try { ok = !!k.run(ctx); } catch (e) { ok = false; if (typeof console !== 'undefined') console.warn('check', k.label, e.message); } return { label: k.label, ok }; });
  return res;
};

/* ---------- outils de TP communs ---------- */
NS.near = (v, t, tol) => Math.abs(v - t) <= tol * Math.max(Math.abs(t), 1e-9);
NS.regScenario = function (sc) { sc.settle = sc.settle || 1.0; SC.push(sc); return sc; };
const STD = { level: 'Bac Pro CIEL', };
NS.std = STD;
})(typeof window !== 'undefined' ? window : globalThis);
(function (g) {
const NS = g.NS;
NS.cutWire = function (c, ra, pa, rb, pb) {
  const A = c.byRef(ra), B = c.byRef(rb), ia = c.pinIndex(A, pa), ib = c.pinIndex(B, pb);
  const m = (e, p, i) => e.c === p.id && e.p === i; const w = c.wires.find(w => (m(w.a, A, ia) && m(w.b, B, ib)) || (m(w.a, B, ib) && m(w.b, A, ia)));
  if (w) c.wires = c.wires.filter(x => x !== w); return !!w;
};
})(typeof window !== 'undefined' ? window : globalThis);

</script>

(function (g) {

regScenario({

const SIG = [
  { wave: 'sin', f: 2500, A: 3, off: 0 }, { wave: 'carre', f: 800, A: 2, off: 1 }, { wave: 'tri', f: 5000, A: 4, off: 0 }, { wave: 'sin', f: 50, A: 5, off: 2 },
];
function sigStats(p) {
  const k = { sin: Math.SQRT1_2, carre: 1, tri: Math.sqrt(1 / 3) }[p.wave]; const rmsAC = p.A * k;
  return { T: 1 / p.f, f: p.f, max: p.off + p.A, min: p.off - p.A, pp: 2 * p.A, mean: p.off, rmsAC, rms: Math.sqrt(p.off * p.off + rmsAC * rmsAC), shape: ['sin', 'carre', 'tri'].indexOf(p.wave) };
}

    { q: 'Période T (en ms)', answer: c => sigStats(c.part('GBF1').p).T * 1000, tol: 0.05, unit: 'ms' },
    { q: 'Fréquence f (en Hz)', answer: c => sigStats(c.part('GBF1').p).f, tol: 0.05, unit: 'Hz' },
    { q: 'Tension maximale V<sub>max</sub> (en V)', answer: c => sigStats(c.part('GBF1').p).max, tol: 0.06, unit: 'V' },
    { q: 'Tension crête à crête V<sub>pp</sub> (en V)', answer: c => sigStats(c.part('GBF1').p).pp, tol: 0.06, unit: 'V' },
    { q: 'Valeur moyenne du signal (en V) — lue en V⎓', answer: c => sigStats(c.part('GBF1').p).mean, tol: 0.06, abs: 0.08, unit: 'V' },
    { q: 'Valeur efficace de la composante alternative, lue en V∿ (en V)', answer: c => sigStats(c.part('GBF1').p).rmsAC, tol: 0.06, unit: 'V' },

    const L = mk(c); const s = SIG[o.variant % SIG.length]; L.p('gbf', 'GBF1', 100, 160, Object.assign({ duty: 50, hidden: true }, s)); R(L, 'R1', 300, 180, 1000, 90); L.p('ground', 'GND1', 200, 320);
    L.p('scope', 'OSC1', 640, 200, { tdiv: 1e-3, v1: 1, v2: 1, on1: true, on2: false, trig: 0, src: 1 }); L.p('multimeter', 'MM1', 820, 170, { mode: 'VDC' }); L.p('multimeter', 'MM2', 960, 170, { mode: 'VAC' });
    const jg = L.j(200, 260); L.w('GBF1', 'OUT', 'R1', 'A'); L.wj('R1', 'B', jg, [[300, 260]]); L.wj('GBF1', 'GND', jg, [[200, 180]]); L.wj('GND1', 'G', jg);
  },
  solve(c) { const L = mk(c); L.w('OSC1', 'CH1', 'R1', 'A'); L.w('OSC1', 'GND', 'GND1', 'G'); L.w('MM1', 'V/Ω/A', 'R1', 'A'); L.w('MM1', 'COM', 'R1', 'B'); L.w('MM2', 'V/Ω/A', 'R1', 'A'); L.w('MM2', 'COM', 'R1', 'B'); },
  checks: [
    { label: 'Oscilloscope câblé sur la sortie du GBF (CH1) et à la masse', run: c => c.scopeWired('', ['R1', 'A'], null) },
    { label: 'Un voltmètre V⎓ est câblé aux bornes de R1', run: c => c.voltmeterAcross('R1', 'A', 'R1', 'B') },
    { label: 'Un voltmètre V∿ est câblé aux bornes de R1', run: c => c.voltmeterAcross('R1', 'A', 'R1', 'B', true) }],
  correction: v => { const s = sigStats(SIG[v % SIG.length]); const nm = { sin: 'sinusoïdal', carre: 'carré', tri: 'triangulaire' }[SIG[v % SIG.length].wave]; return `<p>Signal <b>${nm}</b> : f = ${s.f} Hz (T = ${(s.T * 1000).toPrecision(3)} ms) ; V<sub>max</sub> = ${s.max} V ; V<sub>min</sub> = ${s.min} V ; V<sub>pp</sub> = ${s.pp} V ; valeur moyenne = ${s.mean} V ; valeur efficace de la partie alternative = ${s.rmsAC.toFixed(3)} V.</p><p>Rappel : sinus V<sub>eff</sub> = V<sub>max</sub>/√2 ; carré V<sub>eff</sub> = V<sub>max</sub> ; triangle V<sub>eff</sub> = V<sub>max</sub>/√3. Le multimètre en V⎓ affiche la valeur moyenne ; en V∿ (RMS vrai) la valeur efficace de la composante alternative.</p>`; },
});
NS.sigStats = sigStats;

/* ============================================================ A9 — Filtre RC passe-bas */
regScenario({
  id: 'filtre', cat: '1 · Lois fondamentales', diff: 3, title: 'Filtre RC passe-bas : gain et fréquence de coupure', level: 'Bac Pro CIEL (terminale)', duration: '1 h 30', settle: 0.03,
  refs: 'Filtrage ; réponse en fréquence ; fréquence de coupure ; oscilloscope',
  desc: 'Un signal sinusoïdal de 1 V crête traverse un filtre RC (R = 1,6 kΩ, C = 100 nF). Relevez le gain G = V<sub>s</sub>/V<sub>e</sub> pour plusieurs fréquences et déterminez la fréquence de coupure à −3 dB.',
  objectives: ['Mesurer l\'amplitude d\'entrée et de sortie à l\'oscilloscope', 'Tracer (ou noter) le gain en fonction de la fréquence', 'Trouver f<sub>c</sub> (gain = 0,707) et la comparer à 1/(2πRC)'],
  steps: ['Câblez CH1 sur l\'entrée (sortie GBF), CH2 sur la sortie (aux bornes de C1), GND à la masse.', 'Pour f = 100 Hz, 500 Hz, 1 kHz, 2 kHz, 5 kHz, 10 kHz : réglez le GBF (double-clic), relevez V<sub>e</sub> et V<sub>s</sub> (crête à crête) et calculez G = V<sub>s</sub>/V<sub>e</sub>.', 'Trouvez par essais la fréquence où G = 0,707 : c\'est f<sub>c</sub>.', 'Observez le déphasage entre les deux voies à f<sub>c</sub> (≈ 45°, sortie en retard).'],
  questions: [
    { q: 'Fréquence de coupure théorique 1/(2πRC) (en Hz)', answer: c => 1 / (2 * Math.PI * c.el('R1').value() * c.el('C1').params().C), tol: 0.05, unit: 'Hz' },
    { q: 'Gain mesuré à f = 100 Hz (en valeur, sans unité)', answer: c => { const f = 100, w = 2 * Math.PI * f, RC = c.el('R1').value() * c.el('C1').params().C; return 1 / Math.sqrt(1 + (w * RC) ** 2); }, tol: 0.06 },
    { q: 'Gain à f = 10 kHz (sans unité)', answer: c => { const f = 1e4, w = 2 * Math.PI * f, RC = c.el('R1').value() * c.el('C1').params().C; return 1 / Math.sqrt(1 + (w * RC) ** 2); }, tol: 0.1, abs: 0.01 },
    { q: 'Ce filtre laisse passer…', type: 'choice', options: ['Les basses fréquences (passe-bas)', 'Les hautes fréquences (passe-haut)', 'Une bande étroite (passe-bande)', 'Toutes les fréquences'], correct: 0 },
    { q: 'Au-delà de f<sub>c</sub>, chaque fois que la fréquence est multipliée par 10, le gain est divisé par environ…', type: 'choice', options: ['2', '10', '100', '1,4'], correct: 1 },
  ],
  build(c) {
    const L = mk(c); L.p('gbf', 'GBF1', 100, 160, { wave: 'sin', f: 1000, A: 1, off: 0, duty: 50 }); R(L, 'R1', 300, 140, 1600); L.p('capacitor', 'C1', 440, 180, { C: 1e-7, Vmax: 50, esr: 0.01, pol: false, tol: 10 }, 90); L.p('ground', 'GND1', 200, 320);
    L.p('scope', 'OSC1', 680, 200, { tdiv: 5e-4, v1: 0.5, v2: 0.5, on1: true, on2: true, trig: 0, src: 1 });
    const jg = L.j(200, 260); L.w('GBF1', 'OUT', 'R1', 'A'); L.w('R1', 'B', 'C1', 'A'); L.wj('C1', 'B', jg, [[440, 260]]); L.wj('GBF1', 'GND', jg, [[200, 180]]); L.wj('GND1', 'G', jg);
  },
  solve(c) { const L = mk(c); L.w('OSC1', 'CH1', 'R1', 'A'); L.w('OSC1', 'CH2', 'C1', 'A'); L.w('OSC1', 'GND', 'GND1', 'G'); },
  checks: [{ label: 'Oscilloscope câblé : CH1 entrée, CH2 sortie (C1), GND masse', run: c => c.scopeWired('', ['R1', 'A'], ['C1', 'A']) }, { label: 'Les deux voies sont affichées', run: c => c.part('OSC1').p.on1 && c.part('OSC1').p.on2 }],
  correction: '<p>f<sub>c</sub> = 1/(2πRC) = 1/(2π × 1600 × 100 nF) ≈ <b>995 Hz</b>. Gain théorique G = 1/√(1+(f/f<sub>c</sub>)²) : 0,995 à 100 Hz ; 0,707 à f<sub>c</sub> ; ≈ 0,1 à 10 kHz. Pente : −20 dB/décade (le gain est divisé par 10 quand f est multipliée par 10, au-delà de f<sub>c</sub>). Déphasage −45° à f<sub>c</sub>.</p>',
});
})(typeof window !== 'undefined' ? window : globalThis);

<script>
/* tp_comp.js — TP « Composants » : test hors tension, zener, transistor en commutation, relais */
(function (g) {
'use strict';
const NS = g.NS; const { mk, near, regScenario } = NS;
const R = (L, ref, x, y, v, rot, ex) => L.p('resistor', ref, x, y, Object.assign({ R: v, tol: 5, W: 0.25 }, ex || {}), rot);
const noBurn = { label: 'Aucun composant n\'est détruit', run: c => c.anyBurnt().length === 0 };
const vfTest = (m, I) => { const p = NS.LIB.DIODES[m] || NS.LIB.LEDS[m]; let v = p.n * NS.VT * Math.log(I / p.Is + 1) + I * p.Rs; return v; };

/* ============================================================ B1 — Test des composants */
regScenario({
  id: 'test', cat: '2 · Composants', diff: 2, title: 'Tester les composants hors tension (ohmmètre, diode, continuité)', level: 'Bac Pro CIEL (seconde)', duration: '1 h', variants: 2, variantLabel: '↻ Autre fusible', settle: 0.3,
  refs: 'Composants passifs et actifs ; mesure de résistance ; test de diode ; contrôle de continuité ; maintenance',
  desc: 'Sur la paillasse : une résistance, une diode 1N4007, une LED, un transistor NPN et un fusible. Aucun n\'est alimenté. Avec le multimètre seul, vérifiez l\'état de chaque composant. <b>On mesure toujours hors tension !</b>',
  objectives: ['Mesurer une résistance à l\'ohmmètre et la comparer à sa valeur nominale (tolérance)', 'Tester une diode dans les deux sens : tension de seuil et blocage', 'Contrôler un fusible à l\'aide du mode « continuité » (bip)', 'Vérifier les jonctions base-émetteur et base-collecteur d\'un transistor'],
  steps: ['Mesurez R1 à l\'ohmmètre. Est-elle dans sa tolérance ?', 'Mode « Test diode » : placez le « + » (V/Ω/A) sur l\'anode de D1, le COM sur la cathode : relevez V<sub>F</sub>. Inversez : que lit-on (« OL » = circuit ouvert) ?', 'Même test pour la LED D2 : la LED s\'allume-t-elle faiblement ?', 'Contrôlez le fusible F1 en continuité : bip ou pas de bip ?', 'Transistor Q1 : testez les jonctions B–E et B–C (comme deux diodes) puis C–E (bloqué dans les deux sens).'],
  questions: [
    { q: 'Valeur de R1 mesurée à l\'ohmmètre (en Ω)', answer: c => c.el('R1').value(), tol: 0.03, unit: 'Ω' },
    { q: 'Tension de seuil de D1 au testeur de diode, sens passant (en V)', answer: c => vfTest('1N4007', 1e-3), tol: 0.08, unit: 'V' },
    { q: 'Tension de seuil de la LED D2 au testeur de diode (en V)', answer: c => vfTest('LED rouge', 1e-3), tol: 0.08, unit: 'V' },
    { q: 'Le fusible F1 est…', type: 'choice', options: ['En bon état', 'Grillé (coupé)'], correct: c => (c.part('F1').fault === 'blown' ? 1 : 0) },
    { q: 'Tension V<sub>BE</sub> du transistor au testeur de diode (B vers E, en V)', answer: c => vfTest('1N4007', 1e-3) * 0.97, tol: 0.15, unit: 'V' },
    { q: 'Au testeur de diode, une diode saine dans le sens bloqué affiche…', type: 'choice', options: ['0,6 V', '0 V', '« OL » (circuit ouvert)', 'Un bip continu'], correct: 2 },
  ],
  build(c, o) {
    const L = mk(c); R(L, 'R1', 160, 140, 3300, 0, { tol: 5 }); L.p('diode', 'D1', 360, 140, { model: '1N4007' }); L.p('led', 'D2', 560, 140, { model: 'LED rouge' }); L.p('fuse', 'F1', 160, 280, { I: 0.5, fast: true });
    L.p('bjt', 'Q1', 400, 280, { model: 'BC547B' }); L.p('multimeter', 'MM1', 760, 240, { mode: 'Ohm' });
    if (o.variant === 1) c.byRef('F1').fault = 'blown';
  },
  solve(c) { const L = mk(c); const m = c.byRef('MM1'); m.p.mode = 'Diode'; L.w('MM1', 'V/Ω/A', 'D1', 'A'); L.w('MM1', 'COM', 'D1', 'K'); },
  checks: [
    { label: 'Le multimètre est câblé sur un composant hors tension', run: c => c.meters().some(m => m.a !== m.b) },
    { label: 'Le mode « test diode » est utilisé sur D1 (anode sur +)', run: c => c.meters().some(m => m.mode === 'Diode' && m.a === c.net('D1', 'A') && m.b === c.net('D1', 'K')) }, noBurn],
  correction: '<p>Ohmmètre : 3,3 kΩ ± 5 % (3135 à 3465 Ω). Diode 1N4007 : V<sub>F</sub> ≈ 0,55–0,6 V à 1 mA dans le sens anode → cathode ; « OL » dans l\'autre. LED rouge : ≈ 1,6–1,7 V et elle s\'éclaire faiblement. Fusible : continuité (bip) = sain ; pas de bip = <b>grillé</b>. Transistor NPN : B→E et B→C se comportent comme des diodes (≈ 0,6 V) ; C–E est bloqué dans les deux sens.</p><p>⚠ Un composant se teste <b>hors tension</b> et si possible dessoudé d\'un côté : sinon les autres composants fausseront la mesure.</p>',
});

/* ============================================================ B2 — Zener */
regScenario({
  id: 'zener', cat: '2 · Composants', diff: 3, title: 'Diode Zener : stabilisation de tension', level: 'Bac Pro CIEL (première)', duration: '1 h 15', settle: 0.5,
  refs: 'Diode Zener ; régulation de tension ; résistance série ; puissance maximale',
  desc: 'On veut alimenter une charge sous 5,1 V à partir d\'une alimentation de 12 V avec une diode Zener BZX55C5V1 (0,5 W) et une résistance série R<sub>S</sub>. Dimensionnez R<sub>S</sub> de façon à garder un courant Zener d\'environ 15 mA.',
  objectives: ['Reconnaître le fonctionnement d\'une Zener en inverse (claquage contrôlé)', 'Calculer R<sub>S</sub> = (E − V<sub>Z</sub>) / (I<sub>Z</sub> + I<sub>charge</sub>)', 'Vérifier que la puissance dissipée reste < 0,5 W', 'Observer l\'effet d\'une variation de la tension d\'entrée'],
  steps: ['Mesurez V<sub>Z</sub> aux bornes de la Zener avec R<sub>S</sub> = 1 kΩ. Quel est le courant dans la Zener ?', 'La charge R<sub>L</sub> = 1 kΩ absorbe I<sub>L</sub> ≈ 5 mA. Calculez R<sub>S</sub> pour I<sub>Z</sub> ≈ 15 mA.', 'Remplacez R<sub>S</sub> par la valeur E12 la plus proche ; vérifiez I<sub>Z</sub> (ampèremètre en série avec la Zener) et la puissance.', 'Faites varier E de 10 à 14 V : la tension de sortie varie-t-elle beaucoup ?'],
  questions: [
    { q: 'Tension Zener V<sub>Z</sub> mesurée (en V)', answer: c => c.vd('DZ1', 'K', 'DZ1', 'A'), tol: 0.06, unit: 'V' },
    { q: 'Courant dans la charge I<sub>L</sub> = V<sub>Z</sub> / R<sub>L</sub> (en mA)', answer: c => c.vd('RL', 'A', 'RL', 'B') / c.el('RL').value() * 1000, tol: 0.08, unit: 'mA' },
    { q: 'Résistance R<sub>S</sub> théorique pour I<sub>Z</sub> = 15 mA (en Ω)', answer: () => (12 - 5.1) / 0.020, tol: 0.1, unit: 'Ω' },
    { q: 'Valeur E12 à choisir (en Ω)', answer: () => 330, tol: 0.01, unit: 'Ω' },
    { q: 'Puissance dissipée par la Zener avec cette valeur (en mW)', answer: c => Math.abs(c.vd('DZ1', 'K', 'DZ1', 'A') * c.I('DZ1')) * 1000, tol: 0.2, unit: 'mW' },
    { q: 'Que se passe-t-il si la charge est débranchée (R<sub>L</sub> infinie) ?', type: 'choice', options: ['Rien : la Zener absorbe tout le courant (I<sub>Z</sub> augmente)', 'La tension de sortie double', 'La Zener se bloque', 'R<sub>S</sub> chauffe moins'], correct: 0 },
  ],
  build(c) {
    const L = mk(c); L.p('psu', 'AL1', 100, 160, { V: 12, Ilim: 0.2 }); R(L, 'RS', 300, 140, 1000, 0, { W: 0.5 }); L.p('zener', 'DZ1', 480, 200, { model: 'BZX55C5V1' }, 90); R(L, 'RL', 600, 200, 1000, 90);
    L.p('ground', 'GND1', 200, 320); L.p('multimeter', 'MM1', 760, 240, { mode: 'VDC' }); L.p('multimeter', 'MM2', 940, 240, { mode: 'mA' });
    const jn = L.j(200, 280), j2 = L.j(480, 140), j3 = L.j(480, 280); L.w('AL1', '+', 'RS', 'A'); L.wj('RS', 'B', j2); L.wj('DZ1', 'K', j2); L.wj('RL', 'A', j2, [[600, 140]]); L.wj('DZ1', 'A', j3); L.wj('RL', 'B', j3, [[600, 280]]);
    L.jj(j3, jn); L.wj('AL1', '−', jn, [[200, 180]]); L.wj('GND1', 'G', jn);
  },
  solve(c) { const L = mk(c); const r = c.byRef('RS'); r.p.R = 330; r.p.W = 1; L.w('MM1', 'V/Ω/A', 'DZ1', 'K'); L.w('MM1', 'COM', 'DZ1', 'A'); },
  checks: [
    { label: 'Courant Zener entre 8 mA et 30 mA', run: c => { const I = Math.abs(c.I('DZ1')); return I > 0.008 && I < 0.03; } },
    { label: 'R<sub>S</sub> est une valeur E12', run: c => near(NS.nearestE(c.part('RS').p.R, NS.E12), c.part('RS').p.R, 0.005) },
    { label: 'Tension de sortie 5,1 V ± 5 %', run: c => near(c.vd('RL', 'A', 'RL', 'B'), 5.1, 0.07) },
    { label: 'Un voltmètre est câblé aux bornes de la Zener', run: c => c.voltmeterAcross('DZ1', 'K', 'DZ1', 'A') },
    { label: 'Aucun composant détruit (P<sub>Z</sub> < 0,5 W, P<sub>RS</sub> OK)', run: c => c.anyBurnt().length === 0 }],
  correction: '<p>La Zener polarisée en <b>inverse</b> impose V<sub>Z</sub> = 5,1 V tant que I<sub>Z</sub> reste dans sa plage. I<sub>RS</sub> = I<sub>Z</sub> + I<sub>L</sub> = 15 + 5 = 20 mA → R<sub>S</sub> = (12 − 5,1)/20 mA = 345 Ω → <b>330 Ω</b> (E12). P<sub>Z</sub> = V<sub>Z</sub>·I<sub>Z</sub> ≈ 100 mW < 0,5 W. P<sub>RS</sub> = R·I² ≈ 0,15 W. Si E varie de 10 à 14 V, V<sub>S</sub> ne varie que de quelques dizaines de mV : c\'est la stabilisation.</p>',
});

/* ============================================================ B3 — Transistor en commutation */
regScenario({
  id: 'transistor', cat: '2 · Composants', diff: 3, title: 'Transistor bipolaire en commutation', level: 'Bac Pro CIEL (première)', duration: '1 h 30', settle: 0.4,
  refs: 'Transistor bipolaire NPN ; régime bloqué / saturé ; gain en courant ; résistance de base ; commande de charge',
  desc: 'Un transistor BC547B doit allumer une LED (15 mA) commandée par un signal logique 5 V à travers une résistance de base R<sub>B</sub>. Actuellement R<sub>B</sub> = 470 kΩ : la LED brille à peine car le transistor n\'est pas saturé. Calculez R<sub>B</sub> pour une vraie commutation.',
  objectives: ['Distinguer les régimes bloqué, linéaire et saturé', 'Mesurer I<sub>B</sub>, I<sub>C</sub>, V<sub>BE</sub>, V<sub>CE</sub> et le gain β = I<sub>C</sub>/I<sub>B</sub>', 'Calculer R<sub>B</sub> pour saturer : I<sub>B</sub> ≥ 3·I<sub>C</sub>/β', 'Vérifier V<sub>CE sat</sub> < 0,3 V'],
  steps: ['Interrupteur SW1 fermé, mesurez V<sub>BE</sub> et V<sub>CE</sub> (voltmètre), I<sub>C</sub> (ampèremètre dans la branche LED) puis I<sub>B</sub> avec R<sub>B</sub> = 470 kΩ : le transistor est en régime <b>linéaire</b> (β·I<sub>B</sub> = I<sub>C</sub>).', 'I<sub>C</sub> voulu = 15 mA ; β<sub>min</sub> ≈ 200 : calculez I<sub>B</sub> avec un coefficient de sur-saturation de 3.', 'Calculez R<sub>B</sub> = (5 − 0,7)/I<sub>B</sub> et choisissez une valeur E12 ; remplacez R<sub>B</sub>.', 'Vérifiez V<sub>CE</sub> ≈ 0,1 V (saturé) et la LED à pleine luminosité.'],
  questions: [
    { q: 'Avec R<sub>B</sub> = 470 kΩ : courant de base I<sub>B</sub> (en µA)', answer: () => (5 - 0.69) / 470e3 * 1e6, tol: 0.15, unit: 'µA', hint: 'Mesuré avant de modifier R<sub>B</sub>.' },
    { q: 'Courant de base nécessaire pour saturer : I<sub>B</sub> = 3·I<sub>C</sub>/β avec I<sub>C</sub> = 15 mA, β = 200 (en µA)', answer: () => 225, tol: 0.1, unit: 'µA' },
    { q: 'R<sub>B</sub> théorique = (5 − 0,7)/I<sub>B</sub> (en kΩ)', answer: () => (5 - 0.7) / 225e-6 / 1000, tol: 0.1, unit: 'kΩ' },
    { q: 'Valeur E12 retenue (en kΩ)', answer: () => 18, tol: 0.01, unit: 'kΩ', hint: 'Prenez la valeur E12 ≤ calcul (18 ou 15 kΩ conviennent ; valeur la plus proche : 18).' },
    { q: 'Tension V<sub>CE</sub> du transistor saturé (en V)', answer: c => Math.abs(c.vd('Q1', 'C', 'Q1', 'E')), tol: 0.5, unit: 'V', hint: 'Valeur attendue ≈ 0,1 V.' },
    { q: 'Un transistor saturé se comporte comme…', type: 'choice', options: ['Un interrupteur fermé (V<sub>CE</sub> ≈ 0,1 V)', 'Un interrupteur ouvert', 'Une résistance de 1 MΩ', 'Une source de courant constant'], correct: 0 },
  ],
  build(c) {
    const L = mk(c); L.p('psu', 'AL1', 100, 160, { V: 5, Ilim: 0.2 }); L.p('switch', 'SW1', 280, 140, { closed: true }); R(L, 'RB', 440, 140, 470000, 0); R(L, 'RC', 600, 100, 220, 90); L.p('led', 'D1', 600, 200, { model: 'LED rouge' }, 90);
    L.p('bjt', 'Q1', 560, 340, { model: 'BC547B' }); L.p('ground', 'GND1', 200, 460);

    L.w('RC', 'B', 'D1', 'A'); L.w('D1', 'K', 'Q1', 'C'); L.wj('Q1', 'E', jn, [[580, 420]]); L.wj('AL1', '−', jn, [[200, 180]]); L.wj('GND1', 'G', jn);
  },
  solve(c) { const L = mk(c); c.byRef('RB').p.R = 18000; L.w('MM1', 'V/Ω/A', 'Q1', 'C'); L.w('MM1', 'COM', 'Q1', 'E'); },
